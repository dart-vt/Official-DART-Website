<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171c19" />
    <meta
      name="google-site-verification"
      content="7KZYsuqQZ692DeZTdNJT4xwa6sVmzb2b-ZaI1aJUZ5w"
    />
    <title>DART Robotics — Virginia Tech Combat Robotics</title>
    <meta
      name="description"
      content="Design. Build. Battle. Meet DART, Virginia Tech’s combat robotics team, represented within VT CRO as CroDart. Explore our robots and join the team."
    />
    <meta
      property="og:title"
      content="DART Robotics — Virginia Tech Combat Robotics"
    />
    <meta
      property="og:description"
      content="We design, build, and battle combat robots. Meet DART at Virginia Tech, represented within VT CRO as CroDart."
    />
    <meta
      property="og:image"
      content="https://dart-vt.github.io/Official-DART-Website/images/optimized/arena-1600.webp"
    />
    <meta
      property="og:image:alt"
      content="Combat robots competing inside an enclosed arena"
    />
    <meta
      property="og:url"
      content="https://dart-vt.github.io/Official-DART-Website/"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="canonical"
      href="https://dart-vt.github.io/Official-DART-Website/"
    />
    <link rel="icon" href="%PUBLIC_URL%/images/DART.svg" type="image/svg+xml" />
    <script>
      // Apply the saved/system theme before React paints to avoid a theme flash.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("theme");
        } catch (error) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <noscript>
      DART is Virginia Tech’s Destructive Arena Robotics Team, represented
      within VT CRO as CroDart. Enable JavaScript to explore our robots, team,
      and events. Contact
      <a href="mailto:wewriggers@vt.edu">wewriggers@vt.edu</a> or visit
      <a href="https://www.vtcro.org/teams/crodart"
        >our official CroDart profile</a
      >.
    </noscript>
    <div id="root"></div>
  </body>
</html>
